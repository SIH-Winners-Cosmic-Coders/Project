<!DOCTYPE html>
<html lang="en">
<head>

  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">

  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#023625",
            "primary-container": "#1f4d3a",
            "surface": "#faf9f5",
            "surface-dim": "#dbdad6",
            "surface-container": "#efeeea",
            "surface-container-lowest": "#ffffff",
            "on-surface": "#1b1c1a",
            "on-surface-variant": "#414944",
            "outline": "#717973",
            "error": "#ba1a1a",
            "secondary": "#974723",
            "dark-surface": "#0f172a",
            "dark-card": "#1e293b",
            "dark-border": "#334155"
          },
          fontFamily: {
            "headline-md": ["Plus Jakarta Sans"],
            "body-lg": ["Plus Jakarta Sans"]
          },
          animation: {
            'fade-in-zoom': 'fadeInZoom 0.4s ease-out forwards'
          },
          keyframes: {
            fadeInZoom: {
              '0%': { opacity: '0', transform: 'scale(0.97)' },
              '100%': { opacity: '1', transform: 'scale(1)' }
            }
          }
        }
      }
    };
  </script>

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; overscroll-behavior: none; }
    ::-webkit-scrollbar { display: none; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
    .pt-safe { padding-top: env(safe-area-inset-top, 20px); }
    
    .timeline-line::before {
      content: '';
      position: absolute;
      left: 19px;
      top: 32px;
      bottom: -16px;
      width: 2px;
      background-color: #dbdad6;
      z-index: 0;
    }
    .dark .timeline-line::before {
      background-color: #334155;
    }
    .timeline-item:last-child .timeline-line::before {
      display: none;
    }
  </style>

  <!-- Immediate Theme Initializer -->
  <script>
    function syncTheme() {
      const isDark = localStorage.getItem('theme') === 'dark' || 
                     (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', isDark);
    }
    syncTheme();
    window.addEventListener('storage', (e) => {
      if (e.key === 'theme') syncTheme();
    });
  </script>
</head>

        <button onclick="window.parent.postMessage({type: 'navigate', target: 'home_dashboard'}, '*');" class="active:opacity-70 transition-opacity">

    function populateCropDropdown(selectedCrop = "Wheat") {
      const lang = localStorage.getItem('annadata_global_lang') || 'en';
      const dict = cropTranslations[lang] || cropTranslations['en'];
      const selectEl = document.getElementById('mandi-commodity');
      
      const prevVal = selectEl.value || selectedCrop;
      selectEl.innerHTML = '';

      ALL_CROPS_KEYS.forEach(key => {
        const opt = document.createElement('option');
        opt.value = key; // Always pass standard English key to backend
        opt.innerText = dict[key] || key;
        if (key.toLowerCase() === prevVal.toLowerCase() || key.toLowerCase() === selectedCrop.toLowerCase()) {
          opt.selected = true;
        }
        selectEl.appendChild(opt);
      });
    }

    function applyUiLanguage() {
      const lang = localStorage.getItem('annadata_global_lang') || 'en';
      const dict = i18nDict[lang] || i18nDict['en'];
      
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (dict[key]) el.innerText = dict[key];
      });

      populateCropDropdown();
    }

    function initFarmData() {
      const savedProfile = localStorage.getItem('annadata_user_profile');
      let farmAcres = 12.5;
      let cropName = "Paddy (Rice / Dhaan / ଧାନ)";
      
      if (savedProfile) {
        try {
          const profile = JSON.parse(savedProfile);
          if (profile.farm_size) farmAcres = parseFloat(profile.farm_size.replace(/[^0-9.]/g, '')) || 12.5;
          if (profile.crop) cropName = profile.crop;
        } catch(e) {}
      }
      
      document.getElementById('farm-acres-input').value = farmAcres;
      document.getElementById('mandi-commodity').value = cropName;
      fetchYieldPrediction();
      loadTimeline();
    }

    async function fetchYieldPrediction() {
      const rawCrop = document.getElementById('mandi-commodity').value || "Wheat";
      const commodity = rawCrop.split(' ')[0]; 
      const acres = parseFloat(document.getElementById('farm-acres-input').value) || 1.0;
      
      try {
        // Add this inside loadWeatherData() and fetchYieldPrediction() right after 'try {'
if (localStorage.getItem('annadata_demo_offline') === 'true') throw new Error("Demo Offline Mode Triggered");
        const response = await fetch(`/api/v1/market/predict?commodity=${encodeURIComponent(commodity)}&acres=${acres}&moisture=42.0&temp=28.0`);
        const result = await response.json();

        if (result.status === 'success') {
          currentPrediction = result;
          renderMatrix(result);
          renderAdvisory(result);
        }
      } catch (error) {
        console.error("Inference fetch error:", error);
      }
    }

    function renderMatrix(data) {
      document.getElementById('res-yield').innerText = `${data.total_predicted_yield_quintals.toLocaleString('en-IN')} Q`;
      document.getElementById('res-revenue').innerText = `₹${data.projected_revenue_inr.toLocaleString('en-IN')}`;
      updateFinancials(); 
    }

    function renderAdvisory(data) {
      const banner = document.getElementById('advisory-banner');
      const icon = document.getElementById('advisory-icon');
      const title = document.getElementById('advisory-title');
      const desc = document.getElementById('advisory-desc');
      
      banner.className = "mb-4 p-3.5 rounded-xl flex items-start gap-2.5 border transition-all";
      
      if (data.msp_warning) {
        banner.classList.add('bg-error/10', 'border-error/30', 'text-error', 'dark:text-red-400');
        icon.innerText = "warning";
        title.innerText = "MSP Alert";
        desc.innerText = `Market rate (₹${data.projected_mandi_price_per_q}) is below Govt MSP (₹${data.msp_rate}). Recommend selling at a Govt Procurement Center.`;
      } else if (data.market_strategy === "HOLD") {
        banner.classList.add('bg-secondary/10', 'border-secondary/30', 'text-secondary', 'dark:text-orange-400');
        icon.innerText = "inventory_2";
        title.innerText = "HOLD IN STORAGE";
        desc.innerText = data.strategy_msg;
      } else {
        banner.classList.add('bg-[#10b981]/10', 'border-[#10b981]/30', 'text-[#10b981]', 'dark:text-[#4ade80]');
        icon.innerText = "payments";
        title.innerText = "SELL NOW";
        desc.innerText = data.strategy_msg;
      }
    }

   function updateFinancials() {
      const costPerAcre = parseFloat(document.getElementById('input-cost-slider').value);
      const acres = parseFloat(document.getElementById('farm-acres-input').value) || 1.0;
      const selectedCrop = document.getElementById('mandi-commodity').value;
      
      // 1. Update the Main Cost Display
      document.getElementById('cost-display').innerText = `₹${costPerAcre.toLocaleString('en-IN')}`;
      
      // 2. Dynamic Crop-Specific Cost Ratios (Based on CACP Data)
      let laborPct = 0.40, fertPct = 0.25, machPct = 0.20, seedPct = 0.15;
      
      // If Paddy is selected, adjust to real-world Eastern India metrics
      if (selectedCrop.includes("Paddy")) {
          laborPct = 0.60; // Highly labor intensive (Transplanting/Harvesting)
          fertPct = 0.15;
          machPct = 0.15;  // Includes heavy irrigation
          seedPct = 0.10;
      } else if (selectedCrop.includes("Cotton")) {
          laborPct = 0.45;
          fertPct = 0.20;
          machPct = 0.10;
          seedPct = 0.25;  // Bt Cotton seeds are expensive
      }

      // Update the UI labels dynamically
      document.querySelector('#cost-labor').previousElementSibling.innerText = `Labor (${(laborPct*100).toFixed(0)}%)`;
      document.querySelector('#cost-fert').previousElementSibling.innerText = `Fertilizer (${(fertPct*100).toFixed(0)}%)`;
      document.querySelector('#cost-mach').previousElementSibling.innerText = `Irrig/Mach (${(machPct*100).toFixed(0)}%)`;
      document.querySelector('#cost-seed').previousElementSibling.innerText = `Seed (${(seedPct*100).toFixed(0)}%)`;

      // Calculate and display the segmented costs
      document.getElementById('cost-labor').innerText = `₹${(costPerAcre * laborPct).toLocaleString('en-IN', {maximumFractionDigits: 0})}`;
      document.getElementById('cost-fert').innerText = `₹${(costPerAcre * fertPct).toLocaleString('en-IN', {maximumFractionDigits: 0})}`;
      document.getElementById('cost-mach').innerText = `₹${(costPerAcre * machPct).toLocaleString('en-IN', {maximumFractionDigits: 0})}`;
      document.getElementById('cost-seed').innerText = `₹${(costPerAcre * seedPct).toLocaleString('en-IN', {maximumFractionDigits: 0})}`;
      
      // 3. Calculate Net Profit
      const totalCost = costPerAcre * acres;
      const netProfit = currentPrediction.projected_revenue_inr - totalCost;
      
      const profitEl = document.getElementById('res-profit');
      profitEl.innerText = `₹${netProfit.toLocaleString('en-IN')}`;
      profitEl.className = netProfit >= 0 
        ? "text-xl font-extrabold text-primary dark:text-[#4ade80]" 
        : "text-xl font-extrabold text-error dark:text-red-400";
    }

    function applyAiSuggestion() {
      document.getElementById('mandi-commodity').value = currentPrediction.ai_recommended_crop || "Maize";
      fetchYieldPrediction();
    }

    // Bulletproof Voice-to-Ledger
    function startVoiceLedger() {
      const micBtn = document.getElementById('ledger-mic');
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      
      if (!SpeechRec) { 
        alert("Voice recognition is not supported in this browser. Please use Chrome."); 
        return; 
      }
      
      const recognition = new SpeechRec();
      recognition.continuous = false;
      recognition.interimResults = false;

      const lang = localStorage.getItem('annadata_global_lang') || 'en';
      const dialectMap = { 'en': 'en-IN', 'hi': 'hi-IN', 'od': 'or-IN', 'bn': 'bn-IN', 'te': 'te-IN', 'ta': 'ta-IN', 'mr': 'mr-IN' };
      recognition.lang = dialectMap[lang] || 'en-IN';
      
      recognition.onstart = () => { 
        console.log("🎤 Mic listening...");
        micBtn.classList.replace('bg-primary', 'bg-error');
        micBtn.classList.replace('dark:bg-[#10b981]', 'dark:bg-red-500');
        micBtn.classList.add('animate-pulse'); 
      };

      recognition.onresult = (e) => {
        if (!e.results || !e.results.length) {
            console.log("❌ No results from speech engine.");
            return;
        }

        const transcript = e.results[0][0].transcript.toLowerCase();
        const originalText = e.results[0][0].transcript; 
        console.log("🗣️ Raw Transcript:", originalText);

        const currencyRegex = /(?:rupees|rs|rupaye|rupaya|taka|tanka|roopai|rupay|₹)\s*(\d+)|(\d+)\s*(?:rupees|rs|rupaye|rupaya|taka|tanka|roopai|rupay|₹)?/i;
        const match = transcript.match(currencyRegex);
        
        let extractedCost = 500; 
        if (match) {
            extractedCost = parseInt(match[1] || match[2]);
        } else {
            const genericDigit = transcript.match(/(\d+)/);
            if (genericDigit) extractedCost = parseInt(genericDigit[1]);
        }
        
        if (isNaN(extractedCost)) extractedCost = 500;
        console.log("💰 Extracted Cost:", extractedCost);

        const logTitle = "Voice Log: Expense";
        const container = document.getElementById('timeline-container');
        
        // Ensure the container exists
        if (!container) {
            console.error("❌ Cannot find 'timeline-container' in the DOM.");
            return;
        }

        // Force prepend the new log entry
        const logHtml = `
          <div class="relative mb-3 animate-fade-in-zoom voice-log-entry">
            <div class="absolute -left-[25px] bg-secondary text-white w-6 h-6 rounded-full flex items-center justify-center shadow-md border-2 border-surface dark:border-dark-surface">
              <span class="material-symbols-outlined text-[14px]">receipt_long</span>
            </div>
            <div class="bg-surface-container dark:bg-dark-surface p-3 rounded-xl shadow-sm border border-secondary/50 dark:border-orange-500/50">
              <h3 class="font-bold text-sm text-on-surface dark:text-white">${logTitle}</h3>
              <p class="text-xs text-on-surface-variant dark:text-gray-400 mt-0.5 capitalize">"${originalText}"</p>
              <span class="text-xs font-bold text-error dark:text-red-400 block mt-1">- ₹${extractedCost.toLocaleString('en-IN')}</span>
            </div>
          </div>
        `;
        
        // Insert at the very top of the ledger
        container.insertAdjacentHTML('afterbegin', logHtml);
        console.log("✅ Successfully injected HTML into ledger.");

        const slider = document.getElementById('input-cost-slider');
        const acres = parseFloat(document.getElementById('farm-acres-input').value) || 1.0;
        if(slider) {
            slider.value = Math.min(60000, parseFloat(slider.value) + (extractedCost / acres));
            updateFinancials();
            console.log("✅ Financials updated.");
        }
      };

      recognition.onerror = (e) => {
        console.error("⚠️ Speech error:", e.error);
        micBtn.classList.replace('bg-error', 'bg-primary');
        micBtn.classList.replace('dark:bg-red-500', 'dark:bg-[#10b981]');
        micBtn.classList.remove('animate-pulse'); 
      };

      recognition.onend = () => { 
        console.log("🛑 Mic stopped listening.");
        micBtn.classList.replace('bg-error', 'bg-primary');
        micBtn.classList.replace('dark:bg-red-500', 'dark:bg-[#10b981]');
        micBtn.classList.remove('animate-pulse'); 
      };

      try {
        recognition.start();
      } catch (err) {
        console.error("Failed to start recognition:", err);
      }
    }

    async function loadTimeline() {
      const container = document.getElementById('timeline-container');
      try {
        const response = await fetch('/api/v1/farm/history');
        const result = await response.json();

        if (result.status === 'success' && result.data.length > 0) {
          container.innerHTML = '';
          result.data.forEach(event => {
            const itemHtml = `
              <div class="relative mb-3">
                <div class="absolute -left-[25px] bg-primary-container dark:bg-[#334155] text-white w-6 h-6 rounded-full flex items-center justify-center shadow-md border-2 border-surface dark:border-dark-surface">
                  <span class="material-symbols-outlined text-[14px]">${event.icon_type}</span>
                </div>
                <div class="bg-surface-container dark:bg-dark-surface p-3 rounded-xl shadow-sm border border-surface-dim/40 dark:border-dark-border">
                  <h3 class="font-bold text-sm text-on-surface dark:text-white">${event.title}</h3>
                  <p class="text-xs text-on-surface-variant dark:text-gray-400 mt-0.5">${event.description}</p>
                  <span class="text-[10px] font-bold text-outline dark:text-gray-500 uppercase block mt-1">${event.date_logged}</span>
                </div>
              </div>
            `;
            container.innerHTML += itemHtml;
          });
        }
      } catch (error) {
        console.error("Timeline history fallback active");
      }
    }

    function exportTimelinePDF() {
      const element = document.getElementById('timeline-container');
      element.style.padding = '20px';
      element.style.backgroundColor = document.documentElement.classList.contains('dark') ? '#1e293b' : '#ffffff';
      element.style.borderRadius = '16px';

      const opt = {
        margin: 0.5,
        filename: 'AnnaDATA_Crop_Ledger.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true },
        jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(element).save().then(() => {
        element.style.padding = '0px';
        element.style.backgroundColor = 'transparent';
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      applyUiLanguage();
      initFarmData();
    });

    window.addEventListener('storage', (e) => {
      if (e.key === 'annadata_global_lang') applyUiLanguage();
      if (e.key === 'annadata_user_profile') initFarmData();
      if (e.key === 'theme') syncTheme();
    });
  </script>
