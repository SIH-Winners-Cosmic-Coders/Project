  <script>
    function applyTheme() {
      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        document.getElementById('theme-icon').innerText = 'light_mode';
      } else {
        document.documentElement.classList.remove('dark');
        document.getElementById('theme-icon').innerText = 'dark_mode';
      }
    }
    
    function toggleTheme() {
      if (document.documentElement.classList.contains('dark')) {
        localStorage.theme = 'light';
      } else {
        localStorage.theme = 'dark';
      }
      applyTheme();
    }
    applyTheme();

    function loadProfileData() {
        const savedProfile = localStorage.getItem('annadata_user_profile');
        let userName = "Swayam"; 
        let userLoc = "BHUBANESWAR, ODISHA"; 
        
        if (savedProfile) {
            try {
                const profile = JSON.parse(savedProfile);
                if (profile.location) {
                    userLoc = profile.location.toUpperCase(); 
                }
                if (profile.name) {
                    userName = profile.name.split(" ")[0]; 
                }
                if (profile.farm_size) {
                    const sizeEl = document.getElementById('dash-size');
                    if (sizeEl) sizeEl.innerText = profile.farm_size;
                }
            } catch(e) {}
        }

        const locEl = document.getElementById('dash-location');
        if (locEl) locEl.innerText = userLoc;

        const hour = new Date().getHours();
        let greeting = "Good Evening";
        let emoji = "🌙";
        if (hour < 12) { greeting = "Good Morning"; emoji = "☀️"; }
        else if (hour < 17) { greeting = "Good Afternoon"; emoji = "🌤️"; }
        
        const greetEl = document.getElementById('dynamic-greeting');
        if (greetEl) greetEl.innerText = `${greeting}, ${userName} ${emoji}`;
    }

    setTimeout(() => {
        const ring = document.getElementById('health-ring');
        if(ring) ring.style.strokeDashoffset = '8'; 
    }, 300);

    function goTo(target) {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'navigate', target: target }, '*');
      }
    }

    function applyDashLang() {
      const lang = localStorage.getItem('annadata_global_lang') || 'en';
      const dict = dashI18n[lang] || dashI18n['en'];
      
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (dict[key]) {
          if(el.innerHTML.includes('<br>')) {
             el.innerHTML = dict[key].replace(' &amp; ', ' &amp;<br>').replace(' ', '<br>');
          } else {
             el.innerText = dict[key];
          }
        }
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
        applyDashLang();
        loadProfileData();
        
        const langSelect = document.getElementById('globalLangSelect');
        if (langSelect) {
            langSelect.value = localStorage.getItem('annadata_global_lang') || 'en';
            langSelect.addEventListener('change', (e) => {
                localStorage.setItem('annadata_global_lang', e.target.value);
                applyDashLang();
                window.dispatchEvent(new Event('storage'));
            });
        }
    });

    window.addEventListener('storage', (e) => {
      if (e.key === 'annadata_global_lang') {
        const langSelect = document.getElementById('globalLangSelect');
        if(langSelect) langSelect.value = localStorage.getItem('annadata_global_lang');
        applyDashLang();
      }
      if (e.key === 'annadata_user_profile') loadProfileData();
      if (e.key === 'theme') applyTheme();
    });
  </script>
