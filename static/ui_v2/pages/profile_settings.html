<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary":"#023625", "primary-container":"#1f4d3a", "surface":"#faf9f5",
            "surface-dim":"#dbdad6", "surface-container":"#efeeea", "on-surface":"#1b1c1a",
            "on-surface-variant":"#414944", "outline":"#717973", "error":"#ba1a1a",
            "on-primary":"#ffffff", "on-primary-container":"#8dbda4",
            "dark-surface":"#0f172a", "dark-card":"#1e293b", "dark-border":"#334155",
            "secondary":"#974723", "tertiary":"#462702"
          },
          fontFamily: { "headline-md": ["Plus Jakarta Sans"], "label-caps": ["Plus Jakarta Sans"], "body-lg": ["Plus Jakarta Sans"] },
          animation: { 'fade-in-zoom': 'fadeInZoom 0.4s ease-out forwards' },
          keyframes: { fadeInZoom: { '0%': { opacity: '0', transform: 'scale(0.97)' }, '100%': { opacity: '1', transform: 'scale(1)' } } }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; overscroll-behavior: none; }
    ::-webkit-scrollbar { display: none; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
    .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
  </style>
  <script>
    function syncTheme() { document.documentElement.classList.toggle('dark', localStorage.theme === 'dark'); }
    syncTheme(); window.addEventListener('storage', (e) => { if (e.key === 'theme') syncTheme(); });
  </script>
</head>
<body class="bg-surface dark:bg-dark-surface font-body-lg text-on-surface dark:text-white transition-colors duration-300">

<header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 dark:bg-dark-surface/90 backdrop-blur-xl border-b border-surface-dim/40 dark:border-dark-border shadow-sm transition-colors">
  <div class="flex items-center justify-between h-16 px-5">
    <a class="flex items-center gap-2 active:opacity-70 transition-opacity" onclick="window.parent.postMessage({type: 'navigate', target: 'home_dashboard'}, '*');" href="#">
      <span class="material-symbols-outlined text-primary dark:text-[#a1d1b8] text-[28px]">arrow_back</span>
      <span class="font-headline-md text-primary dark:text-[#a1d1b8] font-bold">Settings</span>
    </a>
  </div>
</header>

<main class="relative w-full pt-20 pb-24 min-h-screen animate-fade-in-zoom">
  <div class="flex flex-col w-full px-5">
    
    <!-- Profile Header (Cleaned of Duplicates) -->
    <section class="pt-4 pb-6 flex flex-col items-center">
      <div class="relative w-32 h-32 rounded-full mb-4 shadow-lg overflow-hidden group cursor-pointer border-4 border-white dark:border-dark-border" onclick="document.getElementById('profile-photo-upload').click()">
        <img id="profile-photo-display" alt="Profile Photo" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/AP1WRLuia8eC0OStMGpbhGblgKpVQm_7sybY_fTzU5Gmji8686cRWUZF1BKQR4DUC5coVbgth24V6zUrJBLWvJOQmXBZ46TsX3B5HGOS1jYtTW5ujc9OmHhs6HrExQLAN9ufQk1Z72sRZYLOvwCzSCCG42nyucFILh0c4XZ3jx2erjQmWmU0_8xMlK6JQvvYSSHppZPvVz6t31fWmb4ljWis2gKqqwwJ7sB6XILYe-k51rGrpt-cipOnU6Ti-Mff"/>
        <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
          <span class="material-symbols-outlined text-white text-[32px]">edit</span>
        </div>
        <input type="file" id="profile-photo-upload" accept="image/*" class="hidden" onchange="updateProfilePhoto(event)">
      </div>
      
      <h1 id="profile-name" class="text-2xl font-bold text-primary dark:text-white mb-1">Ramesh Patel</h1>
      <p class="text-sm font-medium text-on-surface-variant dark:text-gray-400 flex items-center gap-1">
        <span class="material-symbols-outlined text-[18px] text-primary dark:text-[#a1d1b8]">location_on</span>
        <span id="profile-location">Pune, Maharashtra</span>
      </p>
    </section>

    <!-- Farm Summary Cards -->
    <section class="pb-6 grid grid-cols-2 gap-3">
      <div class="bg-surface-container-lowest dark:bg-dark-card rounded-2xl p-4 flex flex-col items-start shadow-sm border border-surface-dim/40 dark:border-dark-border">
        <span class="material-symbols-outlined text-secondary dark:text-orange-400 mb-1">straighten</span>
        <span data-i18n="farmSize" class="text-[10px] font-bold text-on-surface-variant dark:text-gray-400 uppercase tracking-wider mb-1">FARM SIZE</span>
        <span id="settings-farm-size" class="text-xl font-bold text-on-surface dark:text-white">15 Acres</span>
      </div>
      <div class="bg-surface-container-lowest dark:bg-dark-card rounded-2xl p-4 flex flex-col items-start shadow-sm border border-surface-dim/40 dark:border-dark-border">
        <span class="material-symbols-outlined text-secondary dark:text-orange-400 mb-1">grass</span>
        <span data-i18n="mainCrop" class="text-[10px] font-bold text-on-surface-variant dark:text-gray-400 uppercase tracking-wider mb-1">MAIN CROP</span>
        <span id="settings-crop" class="text-xl font-bold text-on-surface dark:text-white">Sugarcane</span>
      </div>
    </section>

    <!-- Logout Button -->
    <button onclick="window.parent.postMessage({type: 'navigate', target: 'login_signup_refined'}, '*');" class="mt-2 p-4 w-full rounded-2xl flex items-center justify-center gap-2 bg-error/10 dark:bg-red-500/10 active:scale-95 transition-transform border border-error/20 dark:border-red-500/20">
      <span class="material-symbols-outlined text-error dark:text-red-400">logout</span>
      <span data-i18n="logout" class="text-sm font-bold text-error dark:text-red-400">Log Out</span>
    </button>

  </div>
</main>

<script>
  function updateProfilePhoto(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const base64 = e.target.result;
        document.getElementById('profile-photo-display').src = base64; 
        const savedProfile = localStorage.getItem('annadata_user_profile');
        let profile = savedProfile ? JSON.parse(savedProfile) : {};
        profile.image = base64;
        localStorage.setItem('annadata_user_profile', JSON.stringify(profile));
      };
      reader.readAsDataURL(file);
    }
  }

  function loadProfileData() {
    const savedProfile = localStorage.getItem('annadata_user_profile');
    if (savedProfile) {
      try {
        const profile = JSON.parse(savedProfile);
        if (profile.name) document.getElementById('profile-name').innerText = profile.name;
        if (profile.location) document.getElementById('profile-location').innerText = profile.location;
        if (profile.image) document.getElementById('profile-photo-display').src = profile.image;
        if (profile.farm_size) document.getElementById('settings-farm-size').innerText = profile.farm_size;
        if (profile.crop) document.getElementById('settings-crop').innerText = profile.crop;
      } catch (e) {}
    }
  }

  document.addEventListener('DOMContentLoaded', loadProfileData);
  window.addEventListener('storage', (e) => {
    if (e.key === 'annadata_user_profile') loadProfileData();
  });
</script>
</body>
</html>
