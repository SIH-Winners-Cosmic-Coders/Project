<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AnnaDATA Farm Digital Twin</title>
  <link rel="stylesheet" href="/static/ui_v2/style.css">
  
  <!-- Material Icons and Local Tailwind CSS for the wrapper shell -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <script src="/static/tailwind.js"></script>

  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #faf9f5; }
    
    /* Adjusted top to 44px to make room for the fixed top status bar */
    .stitch-page { position: fixed; top: 44px; left: 0; right: 0; bottom: 0; width: 100%; height: calc(100vh - 44px); border: 0; background: #faf9f5; }
    
    #toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); z-index: 99999; background: #023625; color: white; padding: 12px 20px; border-radius: 9999px; font-size: 13px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,0.2); opacity: 0; pointer-events: none; transition: all 0.25s ease; }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
  </style>
</head>
<body>

  <!-- ========================================== -->
  <!-- AnnaDATA Active Engine & Telemetry Bar -->
  <!-- ========================================== -->
  <div id="engine-status-bar" class="fixed top-0 left-0 w-full h-[44px] bg-[#023625] text-white px-4 py-2 flex flex-wrap items-center justify-between text-xs border-b border-[#0a4d36] shadow-sm z-[9999]">
    <!-- Left: Engine Tier & Network Indicators -->
    <div class="flex items-center space-x-3">
      <div class="flex items-center space-x-1.5">
        <span id="net-indicator" class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="net-mode-label" class="font-semibold text-emerald-200 uppercase tracking-wide">Edge Mode (Offline-Ready)</span>
      </div>
      <span class="text-white/30">|</span>
      <div class="flex items-center space-x-1.5">
        <span class="text-emerald-300 font-medium">Active LLM:</span>
        <span id="active-llm-badge" class="bg-[#0b4733] border border-emerald-500/30 px-2 py-0.5 rounded text-emerald-100 font-mono text-[11px]">
          Qwen-2.5:3B (Local Quantized)
        </span>
      </div>
      <span class="text-white/30 hidden sm:inline">|</span>
      <div class="hidden sm:flex items-center space-x-1.5">
        <span class="text-emerald-300 font-medium">ASR / TTS:</span>
        <span class="bg-[#0b4733] border border-emerald-500/30 px-2 py-0.5 rounded text-emerald-100 text-[11px]">
          IndicConformer + Whisper
        </span>
      </div>
    </div>

    <!-- Right: 1-Click PDF Report Download Button -->
    <div class="flex items-center space-x-2 mt-1 sm:mt-0">
      <button onclick="triggerFarmReportDownload()" 
              class="flex items-center space-x-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-2.5 py-1 rounded shadow transition-all text-xs">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
        </svg>
        <span>Export Health Summary PDF</span>
      </button>
    </div>
  </div>

  <!-- IFRAME PAGES -->
  <iframe id="page_login_signup_refined" class="stitch-page" title="Login" src="/static/ui_v2/pages/login_signup_refined.html" style="display:block;"></iframe>
  <iframe id="page_home_dashboard" class="stitch-page" title="Home" src="/static/ui_v2/pages/home_dashboard.html" style="display:none;"></iframe>
  <iframe id="page_farm_map_simplified_footer" class="stitch-page" title="Farm Map" src="/static/ui_v2/pages/farm_map_simplified_footer.html" style="display:none;"></iframe>
  <iframe id="page_crop_history" class="stitch-page" title="Crop History" src="/static/ui_v2/pages/crop_history.html" style="display:none;"></iframe>
  <iframe id="page_ai_assistant" class="stitch-page" title="AI Assistant" src="/static/ui_v2/pages/ai_assistant.html" style="display:none;"></iframe>
  <iframe id="page_profile_settings" class="stitch-page" title="Profile Settings" src="/static/ui_v2/pages/profile_settings.html" style="display:none;"></iframe>
  <iframe id="page_irrigation" class="stitch-page" title="Irrigation" src="/static/ui_v2/pages/irrigation.html" style="display:none;"></iframe>
  <iframe id="page_scan_leaf" class="stitch-page" title="Scan Leaf" src="/static/ui_v2/pages/scan_leaf.html" style="display:none;"></iframe>
  <iframe id="page_soil_nutrients" class="stitch-page" title="Soil & Nutrients" src="/static/ui_v2/pages/soil_nutrients.html" style="display:none;"></iframe>
  <iframe id="page_weather" class="stitch-page" title="Weather" src="/static/ui_v2/pages/weather.html" style="display:none;"></iframe>
  <iframe id="page_alerts" class="stitch-page" title="Alerts" src="/static/ui_v2/pages/alerts.html" style="display:none;"></iframe>
  
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/static/ui_v2/script.js"></script>
  
  <!-- Global Presentation Network Toggle -->
  <div class="fixed bottom-[100px] right-5 z-[99999]">
    <button id="demo-network-toggle" onclick="toggleDemoNetwork()" class="bg-[#10b981] text-white px-4 py-2 rounded-full shadow-lg font-bold flex items-center gap-2 border-2 border-white/20 transition-all hover:scale-105">
      <span id="demo-network-icon" class="material-symbols-outlined text-[18px]">wifi</span>
      <span id="demo-network-text" class="text-xs uppercase tracking-wide">Online Mode</span>
    </button>
  </div>

  <script>
    // --- GLOBAL DEMO OFFLINE SWITCH LOGIC ---
    function initNetworkToggle() {
      const isOffline = localStorage.getItem('annadata_demo_offline') === 'true';
      updateToggleUI(isOffline);
    }

    function toggleDemoNetwork() {
      const isOffline = localStorage.getItem('annadata_demo_offline') === 'true';
      const newState = !isOffline;
      
      localStorage.setItem('annadata_demo_offline', newState);
      updateToggleUI(newState);
      
      // Reload ONLY the iframe that is currently visible
      const activeIframe = Array.from(document.querySelectorAll('iframe.stitch-page')).find(frame => frame.style.display !== 'none');
      
      if (activeIframe) {
          activeIframe.contentWindow.location.reload();
      } else {
          window.location.reload();
      }
    }

    function updateToggleUI(isOffline) {
      // 1. Update Bottom Right Button
      const btn = document.getElementById('demo-network-toggle');
      const icon = document.getElementById('demo-network-icon');
      const text = document.getElementById('demo-network-text');
      
      if (btn) {
        if (isOffline) {
          btn.className = "bg-error text-white px-4 py-2 rounded-full shadow-lg font-bold flex items-center gap-2 border-2 border-white/20 transition-all animate-pulse";
          icon.innerText = "wifi_off";
          text.innerText = "Forced Offline";
        } else {
          btn.className = "bg-[#10b981] text-white px-4 py-2 rounded-full shadow-lg font-bold flex items-center gap-2 border-2 border-white/20 transition-all hover:scale-105";
          icon.innerText = "wifi";
          text.innerText = "Online Mode";
        }
      }

      // 2. Update Top Status Banner
      const netBadge = document.getElementById('net-mode-label');
      const netDot = document.getElementById('net-indicator');
      
      if (netBadge && netDot) {
        if (!navigator.onLine || isOffline) {
          netBadge.textContent = 'Forced Offline (Air-Gapped Tier)';
          netDot.className = 'w-2.5 h-2.5 rounded-full bg-amber-400';
        } else {
          netBadge.textContent = 'Edge Mode (Offline-Ready)';
          netDot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse';
        }
      }
    }

    // Logic to handle 1-click PDF download with current local state
    function triggerFarmReportDownload() {
      const profile = JSON.parse(localStorage.getItem('annadata_user_profile') || '{}');
      const farmerName = profile.name || 'Swayam Swastik Sahoo';
      const location = profile.location || 'Bhubaneswar, Odisha';
      const crop = (profile.crop || 'Paddy').split(' (')[0].trim();
      const acres = parseFloat(profile.farm_size || '12.5');

      const url = `/api/v1/farm/report/download?user_name=${encodeURIComponent(farmerName)}&location=${encodeURIComponent(location)}&crop=${encodeURIComponent(crop)}&farm_acres=${acres}&moisture=42.0&temp=28.0&ndvi=0.72`;
      
      // Trigger file download
      window.open(url, '_blank');
    }

    document.addEventListener('DOMContentLoaded', initNetworkToggle);
    window.addEventListener('online', () => updateToggleUI(localStorage.getItem('annadata_demo_offline') === 'true'));
    window.addEventListener('offline', () => updateToggleUI(localStorage.getItem('annadata_demo_offline') === 'true'));
  </script>
</body>
</html>
